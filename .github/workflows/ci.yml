name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Property soak
        run: PROPTEST_CASES=4096 cargo test --all-features --test property

  coverage:
    name: coverage -> codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The LLVM engine (accurate on method chains and generics) needs the
          # llvm-tools component.
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-tarpaulin
      - name: Measure coverage (cobertura.xml)
        run: cargo tarpaulin --all-features --engine llvm --out Xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
